[project]
name = "insurance-fraud-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanmay Roy", email = "tanmayroy521@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
insurance-fraud-detection = "insurance_fraud_detection:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
